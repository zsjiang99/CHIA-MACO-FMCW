[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chia-raco"
version = "0.1.0"
description = "RACO: agentic CGRA hardware/software co-design for FMCW radar with CHIA"
requires-python = ">=3.10"
dependencies = [
  "chialoops==1.0.1",
  "openai>=1.0.0,<4",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chia-raco = "chia_maco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
